<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Habibi Haven — Product</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
      :root { --orange: #145f71; --accent: #ff9b20; --paper: #f7f6f4; --ink: #171717; }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: var(--paper); color: var(--ink); font-family: "DM Mono", monospace; }
      a { color: inherit; }
      .promo-bar { display: grid; min-height: 40px; place-items: center; padding: 8px 20px; background: var(--accent); color: #fff; font-size: 12px; text-transform: uppercase; }
      .site-nav { position: sticky; top: 0; z-index: 10; display: flex; justify-content: center; width: 100%; padding: 20px; background: rgba(247, 246, 244, .92); backdrop-filter: blur(14px); }
      .nav-inner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: min(100%, 1280px); min-height: 40px; margin: 0 auto; }
      .menu-link, .brand, .social-link, .edit-link { color: var(--orange); text-decoration: none; }
      .menu-link { justify-self: start; font-size: 16px; line-height: 1; }
      .menu-count { font-size: 12px; }
      .brand { justify-self: center; }
      .brand-logo { display: block; width: 56px; height: 56px; object-fit: contain; background: url("Habibi%20logo.png") center / contain no-repeat; filter: brightness(0) saturate(100%) invert(81%) sepia(21%) saturate(1147%) hue-rotate(154deg) brightness(101%) contrast(91%); }
      .nav-actions { display: flex; align-items: center; justify-self: end; gap: 20px; }
      .socials { display: flex; align-items: center; gap: 17px; }
      .social-link { display: grid; width: 18px; height: 18px; place-items: center; }
      .social-link svg { width: 100%; height: 100%; }
      .edit-link { display: inline-flex; align-items: center; gap: 10px; min-height: 30px; padding: 7px 10px; border-radius: 5px; background: var(--accent); color: #fff; font-size: 13px; text-transform: uppercase; }
      .product-page { width: min(100% - 40px, 1000px); margin: 0 auto; padding: 76px 0 110px; }
      .product-heading { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 30px; margin-bottom: 52px; }
      .product-category { display: inline-block; width: max-content; margin-bottom: 25px; padding: 7px 10px 6px; border: 1px solid var(--orange); border-radius: 5px; color: var(--orange); font-size: 13px; text-transform: uppercase; }
      h1 { max-width: 760px; margin: 0; color: var(--orange); font-family: Inter, sans-serif; font-size: clamp(64px, 12vw, 150px); font-weight: 400; letter-spacing: -.09em; line-height: .82; text-transform: lowercase; }
      .product-meta { display: flex; align-items: center; gap: 10px; padding-bottom: 4px; }
      .meta-chip { padding: 8px 11px 7px; border: 1px solid var(--orange); border-radius: 5px; color: var(--orange); font-size: 14px; white-space: nowrap; }
      .product-visual { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 40px; align-items: end; }
      .product-image { aspect-ratio: 1.12; overflow: hidden; background: #ede9e3; }
      .product-image img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .product-description { margin: 0 0 6px; color: var(--orange); font-family: Inter, sans-serif; font-size: clamp(20px, 2.5vw, 28px); letter-spacing: -.045em; line-height: 1.12; }
      .product-price { margin: 0; color: var(--orange); font-size: 18px; }
      .add-to-order { display: inline-flex; margin-top: 28px; padding: 13px 18px; border: 0; border-radius: 5px; background: var(--accent); color: #fff; cursor: pointer; font: inherit; text-transform: uppercase; }
      .product-nav { display: flex; justify-content: space-between; gap: 30px; margin-top: 58px; }
      .product-nav a { color: var(--orange); font-size: 16px; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 7px; }
      .product-nav a:last-child { text-align: right; }
      @media (max-width: 700px) {
        .site-nav { padding: 8px 14px; }
        .nav-inner { grid-template-columns: 1fr auto 1fr; row-gap: 0; min-height: 0; }
        .brand { grid-column: 2; grid-row: 1; justify-self: center; }
        .brand-logo { width: 42px; height: 42px; }
        .menu-link { grid-column: 1; grid-row: 1; }
        .nav-actions { grid-column: 3; grid-row: 1; justify-self: end; justify-content: flex-end; gap: 12px; }
        .socials { gap: 13px; }
        .edit-link { display: none; }
        .product-page { width: min(100% - 40px, 520px); padding-top: 56px; }
        .product-heading { display: block; margin-bottom: 34px; }
        h1 { font-size: clamp(60px, 18vw, 100px); }
        .product-meta { margin-top: 28px; }
        .product-visual { display: block; }
        .product-image { margin-bottom: 28px; aspect-ratio: 1.05; }
        .product-description { font-size: 20px; }
      }
    </style>
    <link rel="stylesheet" href="search.css" />
    <script src="search.js" defer></script>
  </head>
  <body>
    <div class="promo-bar">20% on meals this week — recharge daily</div>
    <nav class="site-nav" aria-label="Main navigation">
      <div class="nav-inner">
        <a class="menu-link" href="menu.html#menu">Menu <span class="menu-count">6</span></a>
        <a class="brand" href="index.html" aria-label="Habibi Haven home"><img class="brand-logo" src="Habibi%20logo.svg" alt="Habibi Haven" /></a>
          <div class="nav-actions">
          <div class="socials" aria-label="Utility links">
            <a class="social-link" href="#search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.2"/><path d="m15.5 15.5 4.5 4.5"/></svg></a>
            <a class="social-link" href="#account" aria-label="Account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.8-3.5 3-5.2 6.5-5.2s5.7 1.7 6.5 5.2"/></svg></a>
            <a class="social-link" href="checkout.html" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h2l1.7 9.2a2 2 0 0 0 2 1.6h6.8a2 2 0 0 0 1.9-1.4L20 8H7"/><circle cx="10" cy="19" r="1"/><circle cx="17" cy="19" r="1"/></svg></a>
          </div>
          <a class="edit-link" href="index.html#contact">Contact us <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </nav>
    <main class="product-page">
      <section class="product-heading" aria-live="polite">
        <div><span class="product-category" id="product-category"></span><h1 id="product-name"></h1></div>
        <div class="product-meta"><span class="meta-chip" id="product-price"></span><span class="meta-chip">Fresh</span><span class="meta-chip">Halal</span></div>
      </section>
      <section class="product-visual" aria-label="Product details">
        <div class="product-image"><img id="product-image" src="" alt="" /></div>
        <div><p class="product-description" id="product-description"></p><button class="add-to-order" id="add-to-order" type="button">Add to order</button></div>
      </section>
      <nav class="product-nav" aria-label="Other products"><a id="previous-product" href="#"></a><a id="next-product" href="#"></a></nav>
    </main>
    <script>
      const products = [
        { key: 'direktor', name: 'Direktor', category: 'Mains', price: 1100, image: 'Food/Direktor.jpg', description: 'A generous house favourite made for a satisfying meal.' },
        { key: 'curry-rice', name: 'Curry & rice meal', category: 'Mains', price: 450, image: 'Food/Curry%20%26%20rice%20meal.jpg', description: 'Comforting curry served with fragrant rice and plenty of flavour.' },
        { key: 'clubhouse', name: 'Clubhouse sandwich', category: 'Sandwiches', price: 2050, image: 'Food/Clubhouse%20sandwich.jpg', description: 'A stacked clubhouse sandwich for an easy, generous lunch.' },
        { key: 'chickenbiryani', name: 'chickenbiryani', category: 'Mains', price: 850, image: 'Food/chickenbiryani.jpg', description: 'Fragrant chicken biryani prepared for sharing.' },
        { key: 'lamb-mandi', name: 'lamb mandi', category: 'Mains', price: 1100, image: 'Food/lamb%20mandi.jpg', description: 'Tender lamb with fragrant rice and rich, comforting flavour.' },
        { key: 'lamb-chops', name: 'lamb chops', category: 'Grills', price: 360, image: 'Food/lamb%20chops.jpg', description: 'Grilled lamb chops with a smoky finish.' }
      ];
      const selectedKey = new URLSearchParams(window.location.search).get('product') || products[0].key;
      const selectedIndex = Math.max(0, products.findIndex((product) => product.key === selectedKey));
      const product = products[selectedIndex];
      const previous = products[(selectedIndex - 1 + products.length) % products.length];
      const next = products[(selectedIndex + 1) % products.length];
      document.title = `Habibi Haven — ${product.name}`;
      document.querySelector('#product-category').textContent = product.category;
      document.querySelector('#product-name').textContent = product.name;
      document.querySelector('#product-price').textContent = `KES ${product.price.toLocaleString()}`;
      document.querySelector('#product-description').textContent = product.description;
      const image = document.querySelector('#product-image');
      image.src = product.image;
      image.alt = product.name;
      const previousLink = document.querySelector('#previous-product');
      previousLink.href = `product.html?product=${previous.key}`;
      previousLink.textContent = `‹ ${previous.name}`;
      const nextLink = document.querySelector('#next-product');
      nextLink.href = `product.html?product=${next.key}`;
      nextLink.textContent = `${next.name} ›`;
      document.querySelector('#add-to-order').addEventListener('click', () => {
        const cart = JSON.parse(localStorage.getItem('habibiCart') || '[]');
        const existing = cart.find((item) => item.key === product.key);
        if (existing) existing.quantity += 1;
        else cart.push({ key: product.key, name: product.name, price: product.price, image: product.image, quantity: 1 });
        localStorage.setItem('habibiCart', JSON.stringify(cart));
        window.location.href = 'checkout.html';
      });
    </script>
  </body>
</html>
